version: "3.7"

services:
  app_proxy:
    environment:
      APP_HOST: zht-bc2-stratum-web
      APP_PORT: 8080
      JWT_SECRET: "${JWT_SECRET}"
    networks:
      - umbrel_main_network

  stratum:
    image: ghcr.io/zahidliono/zht-bch2-stratum:latest
    restart: unless-stopped
    stop_grace_period: 10s
    user: "1000:1000"
    environment:
      RPC_HOST: umbrel-host
      RPC_PORT: "9009"
      RPC_USER: zahidliono
      RPC_PASS: "Idd=9108"
      PAYOUT_ADDRESS: "bc1q0m9qt239x7dz6ha3lmlr95ty5y0cc6rp59h26a"
      STRATUM_PORT: "4581"
      DIFFICULTY: "1"
      COINBASE_MSG: "ZHT"
    extra_hosts:
      - "umbrel-host:host-gateway"
    ports:
      - "4581:4581/tcp"
    networks:
      default: {}
      umbrel_main_network:
        aliases:
          - zht-bc2-stratum-web

networks:
  umbrel_main_network:
    external: true
    name: umbrel_main_network
