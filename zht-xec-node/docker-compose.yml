version: "3.7"

services:

  app_proxy:
    environment:
      APP_HOST: zht-xec-node_web_1
      APP_PORT: 8080

  web:
    image: amir20/dozzle:v8.12.8@sha256:8ff3115c9c9dd7576839df6f2575de345ca7cafa398cf2496f1f19c31d862ac1
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    restart: on-failure
    depends_on:
      - node

  node:
    image: bitcoinabc/bitcoin-abc:latest
    restart: on-failure
    stop_grace_period: 1m
    volumes:
      - ${APP_DATA_DIR}/.ecash:/root/.bitcoin
    ports:
      - 9006:9006    # RPC
      - 7006:7006    # ZMQ
      - 8336:8336    # P2P
    entrypoint: "bitcoind -printtoconsole -server -prune=550 -wallet=default -zmqpubhashblock=tcp://127.0.0.1:7006 -rpcbind=0.0.0.0 -rpcport=9006 -rpcallowip=0.0.0.0/0 -port=8336 -rpcuser=zahidliono -rpcpassword=Idd=9108 -maxtipage=504576000"
