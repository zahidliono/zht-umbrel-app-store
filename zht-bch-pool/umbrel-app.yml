manifestVersion: 1
id: zht-bch-pool
category: Mining Nodes
name: BCH Node + Solo Pool
version: "0.9.1"
port: 5012
tagline: BCH full node + integrated solo stratum pool
description: >-
  Run a Bitcoin Cash full node (BCHN) and an integrated solo Stratum v1 pool (ckpool) as a single app.


  Features:
    - Dashboard for node sync and pool stats
    - CashAddr to legacy payout address conversion for ckpool compatibility
    - Difficulty presets (vardiff) tuned for home miners
    - Blocks view for solved blocks, plus optional history scan


  Miner connection:
    - Set your payout address in the app Settings tab
    - URL: stratum+tcp://<your-umbrel-ip>:4567
    - Username: worker name (optional). walletAddress.workername also works
    - Password: anything


  Notes:
    - For maximum compatibility use a legacy BCH Base58 address (1... / 3...) as the payout address
    - Many wallets show CashAddr (q... / p...). The app automatically converts CashAddr to legacy format
    - Conversion happens locally on your device
    - Solo mining is extremely unlikely to find blocks without significant hashrate
    - First sync can be slow on small or busy systems. SSD strongly recommended


  Components:
    - Bitcoin Cash Node (BCHN) full node (MIT): https://gitlab.com/bitcoin-cash-node/bitcoin-cash-node
    - ckpool (GPLv3) solo pool engine: https://github.com/ctubio/ckpool


  © 2026 ZHT. All rights reserved.

developer: ZHT
website: https://github.com/zahidliono/zht-umbrel-app-store
repo: https://github.com/zahidliono/zht-umbrel-app-store
support: https://github.com/zahidliono/zht-umbrel-app-store
submitter: ZHT
dependencies: []
icon: https://bitcoincash.org/img/green/bitcoin-cash-circle.svg
gallery:
  - https://bitcoincash.org/img/green/bitcoin-cash-circle.svg
path: ""
defaultUsername: ""
defaultPassword: ""
widgets:
  - id: "sync"
    type: "text-with-progress"
    refresh: "5s"
    endpoint: "zht-bch-pool-app:3000/api/widget/sync"
    link: ""
    example:
      type: "text-with-progress"
      link: ""
      title: "BCH sync"
      text: "83%"
      progressLabel: "In progress"
      progress: 0.83
  - id: "pool"
    type: "three-stats"
    refresh: "30s"
    endpoint: "zht-bch-pool-app:3000/api/widget/pool"
    link: ""
    example:
      type: "three-stats"
      link: ""
      items:
        - title: "Hashrate"
          text: "1.2"
          subtext: "TH/s"
        - title: "Workers"
          text: "2"
        - title: "Best Share"
          text: "21"
          subtext: "G"
backupIgnore:
  - data/node/blocks
  - data/node/chainstate
  - data/node/indexes
releaseNotes: >-
  2026.05.25 - Initial Release
