version: "3.7"

services:
  app_proxy:
    environment:
      APP_HOST: zht-bch-pool-app
      APP_PORT: 3000
      JWT_SECRET: "${JWT_SECRET}"
    networks:
      - umbrel_main_network

  init:
    image: alpine:3.22.1
    volumes:
      - ${APP_DATA_DIR}/data:/data
      - ${APP_DATA_DIR}:/appdata
    environment:
      PAYOUT_ADDRESS: "114iaCze9nXjXDSWqRZBXQp5tLPtraWyAS"
    command:
      - /bin/sh
      - -ec
      - |-
        set -eu

        if [ -n "${JWT_SECRET:-}" ]; then
          envfile="/appdata/.env"
          tmp="/appdata/.env.tmp"
          if [ -f "$$envfile" ]; then
            grep -v '^JWT_SECRET=' "$$envfile" > "$$tmp" || true
          else
            : > "$$tmp"
          fi
          printf "JWT_SECRET=%s\n" "${JWT_SECRET}" >> "$$tmp"
          chmod 600 "$$tmp" || true
          chown 1000:1000 "$$tmp" || true
          mv "$$tmp" "$$envfile"
        fi

        mkdir -p /data/pool/config /data/pool/logs /data/pool/www/pool /data/pool/www/users

        touch /appdata/settings.yml
        chown 1000:1000 /appdata/settings.yml || true
        chown -R 1000:1000 /data/pool

        if [ ! -f /data/pool/config/ckpool.conf ]; then
          printf '{\n  "btcd": [{"url": "umbrel-host:9002", "auth": "zahidliono", "pass": "Idd=9108", "notify": true}],\n  "btcaddress": "%s",\n  "btcsig": "/ZHT Solo BCH/",\n  "blockpoll": 100,\n  "nonce1length": 4,\n  "nonce2length": 8,\n  "update_interval": 30,\n  "version_mask": "1fffe000",\n  "serverurl": ["0.0.0.0:3333"],\n  "mindiff": 1,\n  "startdiff": 42,\n  "maxdiff": 0,\n  "logdir": "/data/pool/logs"\n}\n' \
            "$$PAYOUT_ADDRESS" > /data/pool/config/ckpool.conf
          chown 1000:1000 /data/pool/config/ckpool.conf
        fi

  ckpool:
    image: ghcr.io/zahidliono/zht-ckpool:latest
    user: "1000:1000"
    restart: on-failure
    stop_grace_period: 30s
    depends_on:
      init:
        condition: service_completed_successfully
    extra_hosts:
      - "umbrel-host:host-gateway"
    ports:
      - "4567:3333/tcp"     # Stratum — point your ASIC here
    volumes:
      - ${APP_DATA_DIR}/data/pool/config:/data/pool/config:ro
      - ${APP_DATA_DIR}/data/pool/logs:/data/pool/logs
    command: ["-B", "-c", "/data/pool/config/ckpool.conf"]

  app:
    image: ghcr.io/zahidliono/zht-bch-pool-app:latest
    user: "1000:1000"
    restart: on-failure
    stop_grace_period: 30s
    depends_on:
      init:
        condition: service_completed_successfully
    extra_hosts:
      - "umbrel-host:host-gateway"
    networks:
      default:
        aliases:
          - zht-bch-pool-app
      umbrel_main_network:
        aliases:
          - zht-bch-pool-app
    volumes:
      - ${APP_DATA_DIR}/data:/data
    environment:
      NETWORK_IP: "${NETWORK_IP}"
      BCH_RPC_HOST: "umbrel-host"
      BCH_RPC_PORT: "9002"
      BCH_RPC_USER: "zahidliono"
      BCH_RPC_PASS: "Idd=9108"
      CKPOOL_STATUS_DIR: "/data/pool/www/pool"
      CKPOOL_USERS_DIR: "/data/pool/www/users"

networks:
  umbrel_main_network:
    external: true
    name: umbrel_main_network
