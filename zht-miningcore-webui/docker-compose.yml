version: "3.7"

services:
  app_proxy:
    environment:
      APP_HOST: zht-miningcore-webui-web
      APP_PORT: 80
      JWT_SECRET: "${JWT_SECRET}"
    networks:
      - umbrel_main_network

  init:
    image: alpine:3.22.1
    volumes:
      - ${APP_DATA_DIR}/data:/data
    command:
      - /bin/sh
      - -ec
      - |-
        set -eu
        mkdir -p /data/html /data/conf
        printf '%s' '' \
          | base64 -d > /data/conf/default.conf
        printf '%s' '' \
          | base64 -d > /data/html/index.html
        chmod 644 /data/conf/default.conf /data/html/index.html

  web:
    image: nginx:alpine
    restart: on-failure
    stop_grace_period: 10s
    depends_on:
      init:
        condition: service_completed_successfully
    networks:
      default: {}
      umbrel_main_network:
        aliases:
          - zht-miningcore-webui-web
    volumes:
      - ${APP_DATA_DIR}/data/html:/usr/share/nginx/html:ro
      - ${APP_DATA_DIR}/data/conf:/etc/nginx/conf.d:ro

networks:
  umbrel_main_network:
    external: true
    name: umbrel_main_network
