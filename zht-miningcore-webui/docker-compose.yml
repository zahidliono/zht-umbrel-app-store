version: "3.7"

services:

  app_proxy:
    environment:
      APP_HOST: zht-miningcore-webui_nginx_1
      APP_PORT: 8080

  nginx:
    image: nginx:alpine
    restart: on-failure
    volumes:
      - /home/umbrel/.miningcore/nginx-webui.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - web

  web:
    image: theretromike/miningcorewebui
    restart: on-failure
    volumes:
      - /home/umbrel/.miningcore:/app/miningcore
    user: "1000:1000"
    environment:
      - POOL_NAME=ZHT Solo Mining Pool | BTC · BSV · DGB · BCH · FB
      - STRATUM_HOST=umbrel.local
      - API_BASE_URL=http://zht-miningcore_server_1:4000/api
      - PLATFORM=UMBREL
      - ASPNETCORE_HTTP_PORTS=8081
