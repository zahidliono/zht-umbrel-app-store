version: "3.7"

services:
  app_proxy:
    environment:
      APP_HOST: zht-bch2-stratum-web
      APP_PORT: 80
      JWT_SECRET: "${JWT_SECRET}"
    networks:
      - umbrel_main_network

  stratum:
    image: ghcr.io/zahidliono/zht-bch2-stratum:latest
    restart: unless-stopped
    stop_grace_period: 10s
    user: "1000:1000"
    environment:
      RPC_HOST: umbrel-host
      RPC_PORT: "9010"
      RPC_USER: zahidliono
      RPC_PASS: "Idd=9108"
      PAYOUT_ADDRESS: "bitcoincashii:qqrdx0ayq4zduygkv03qd6hs55lxs0345syv78d9v3"
      STRATUM_PORT: "4582"
      DIFFICULTY: "1"
      COINBASE_MSG: "ZHT"
    extra_hosts:
      - "umbrel-host:host-gateway"
    ports:
      - "4582:4582/tcp"
    networks:
      default: {}
      umbrel_main_network:
        aliases:
          - zht-bch2-stratum-web

networks:
  umbrel_main_network:
    external: true
    name: umbrel_main_network
