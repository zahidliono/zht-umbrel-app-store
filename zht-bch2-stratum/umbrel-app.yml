manifestVersion: 1
id: zht-bch2-stratum
category: Mining Nodes
name: ZHT BCH2 Solo Stratum
version: "1.0.0"
port: 5023
tagline: Lightweight Stratum v1 solo pool for Bitcoin Cash II (BCH2)
description: >-
  A minimal Python Stratum v1 solo mining server for Bitcoin Cash II (BCH2).
  Connects directly to your ZHT BCH2 Node and serves SHA-256 work to your ASIC
  miner. No database, no .NET — just a single lightweight container.


  Requires:
    - Bitcoin Cash II (BCH2) Node (zht-bchii-node) installed and synced


  ASIC Stratum Port:
    - BCH2 → stratum+tcp://<umbrel-ip>:4582


  Worker format: bitcoincashii:qqrdx0ayq4zduygkv03qd6hs55lxs0345syv78d9v3.rig1
  Password: x (anything)


  Block rewards pay directly to the configured payout address.


  ⚠️ Requires x86_64 (amd64) Umbrel.

developer: ZHT
website: https://github.com/zahidliono/zht-umbrel-app-store
repo: https://github.com/zahidliono/zht-umbrel-app-store
support: https://github.com/zahidliono/zht-umbrel-app-store
submitter: ZHT
dependencies: []
icon: https://bitcoincash.org/img/green/bitcoin-cash-circle.svg
gallery:
  - https://bitcoincash.org/img/green/bitcoin-cash-circle.svg
path: ""
defaultUsername: ""
defaultPassword: ""
releaseNotes: >-
  1.0.0 - Initial release. Lightweight Python stratum server for BCH2 solo mining on port 4582.
