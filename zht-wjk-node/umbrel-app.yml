id: zht-wjk-node
name: WojakcCoin (WJK) Node
tagline: Full WojakcCoin node — solo mine or contribute to the WJK network.
icon: https://wojakcoin.cash/favicon.ico
category: Mining Nodes
version: "1.21.3.0"
port: 5036
description: |
  Full WojakcCoin (WJK) node powered by WojakCore v1.21.3.0.

  WojakcCoin is a SHA-256d proof-of-work meme coin fully compatible with Bitcoin ASICs. This node connects to the WJK peer-to-peer network, downloads and fully validates the blockchain, and exposes an RPC interface for mining pool software.

  Use with ZHT WJK Solo Stratum to solo mine WojakcCoin with your Bitaxe or other SHA-256 ASIC.

  RPC Port: 9012
  P2P Port: 20759

  Stratum mining support requires ZHT WJK Solo Stratum (zht-wjk-stratum).

  © 2026 ZHT. All rights reserved.

