manifestVersion: 1
id: zht-wjk-stratum
category: Mining Nodes
name: ZHT WJK Solo Stratum
version: "1.0.0"
port: 5037
tagline: Lightweight Stratum v1 solo pool for WojakcCoin (WJK)
description: >-
  A minimal Python Stratum v1 solo mining server for WojakcCoin (WJK).
  Connects directly to your ZHT WJK Node and serves SHA-256 work to your ASIC
  miner. No database, no .NET — just a single lightweight container.


  Requires:
    - WojakcCoin (WJK) Node (zht-wjk-node) installed and synced


  ASIC Stratum Port:
    - WJK → stratum+tcp://<umbrel-ip>:4586


  Worker format: WYOURADDRESS.rig1
  Password: x (anything)


  Block rewards pay directly to the configured payout address.

developer: ZHT
