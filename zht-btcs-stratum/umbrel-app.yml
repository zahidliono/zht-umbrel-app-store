gallery:
  - https://raw.githubusercontent.com/bitcoin-silver/core/main/share/pixmaps/bitcoin256.png
path: ""
defaultUsername: ""
defaultPassword: ""
releaseNotes: >-
  1.0.0 - Initial release. Lightweight Python stratum server for BTCS solo mining on port 4585.
