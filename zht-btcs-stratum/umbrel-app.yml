manifestVersion: 1
id: zht-btcs-stratum
category: Mining Nodes
name: ZHT BTCS Solo Stratum
version: "1.0.0"
port: 5035
tagline: Lightweight Stratum v1 solo pool for Bitcoin Silver (BTCS)
description: >-
  A minimal Python Stratum v1 solo mining server for Bitcoin Silver (BTCS).
  Connects directly to your ZHT BTCS Node and serves SHA-256 work to your ASIC
  miner. No database, no .NET — just a single lightweight container.


  Requires:
    - Bitcoin Silver (BTCS) Node (zht-btcs-node) installed and synced


  ASIC Stratum Port:
    - BTCS → stratum+tcp://<umbrel-ip>:4585


  Worker format: bs1qYOURADDRESS.rig1
  Password: x (anything)


  Block rewards pay directly to the configured payout address.

developer: ZHT
website: https://github.com/zahidliono/zht-umbrel-app-store
