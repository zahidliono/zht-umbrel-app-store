gallery:
  - https://bitcoincash.org/img/green/bitcoin-cash-circle.svg
path: ""
defaultUsername: ""
defaultPassword: ""
releaseNotes: >-
  1.0.0 - Initial release. Lightweight Python stratum server for XEC solo mining on port 4583.
