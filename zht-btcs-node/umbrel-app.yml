manifestVersion: 1
id: zht-btcs-node
name: Bitcoin Silver (BTCS) Node
tagline: Full Bitcoin Silver node — solo mine or contribute to the BTCS network.
icon: https://raw.githubusercontent.com/bitcoin-silver/core/main/share/pixmaps/bitcoin256.png
category: Mining Nodes
version: "31.1.3"
port: 5034
description: |
  Full Bitcoin Silver (BTCS) node powered by Bitcoin Silver Core v31.1.3.

  Bitcoin Silver is a SHA-256d proof-of-work coin fully compatible with Bitcoin ASICs. This node connects to the BTCS peer-to-peer network, downloads and fully validates the blockchain, and exposes an RPC interface for mining pool software.

  Use with ZHT BTCS Solo Stratum to solo mine Bitcoin Silver with your Bitaxe or other SHA-256 ASIC.

  RPC Port: 9011
  P2P Port: 10566

  Stratum mining support requires ZHT BTCS Solo Stratum (zht-btcs-stratum).

  © 2026 ZHT. All rights reserved.

