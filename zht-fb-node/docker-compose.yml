version: "3.7"

services:

  app_proxy:
    environment:
      APP_HOST: zht-fb-node_web_1
      APP_PORT: 8080

  web:
    image: amir20/dozzle:v8.12.8@sha256:8ff3115c9c9dd7576839df6f2575de345ca7cafa398cf2496f1f19c31d862ac1
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    restart: on-failure
    depends_on:
      - node

  node:
    image: fractalbitcoin/fractal:v0.3.0rc3
    restart: on-failure
    stop_grace_period: 1m
    volumes:
      - ${APP_DATA_DIR}/.fractal:/data
    ports:
      - 9007:9007    # RPC
      - 7007:7007    # ZMQ
      - 8337:8337    # P2P
    entrypoint: "bitcoind -datadir=/data/ -printtoconsole -server -prune=550 -wallet=default -zmqpubhashblock=tcp://127.0.0.1:7007 -rpcbind=0.0.0.0 -rpcport=9007 -rpcallowip=0.0.0.0/0 -port=8337 -rpcuser=zahidliono -rpcpassword=Idd=9108 -maxtipage=504576000"
