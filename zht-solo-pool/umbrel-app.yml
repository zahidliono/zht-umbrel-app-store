manifestVersion: 1
id: zht-solo-pool
category: Mining Nodes
name: ZHT Solo Mining Pool
version: "1.0.0"
port: 5021
tagline: Solo mine BCH, BSV, DGB and FB directly from your ASIC
description: >-
  Lightweight solo mining pool powered by ckpool. Connects to your existing ZHT node apps and serves Stratum v1 to your ASIC miners — no database, no accounts, no fees.


  Requires the following ZHT node apps to be installed:
    - Bitcoin Cash (BCH) Node
    - Bitcoin SV (BSV) Node
    - DigiByte SHA256 Node
    - Fractal Bitcoin (FB) Node


  ASIC Stratum Ports:
    - BCH  → stratum+tcp://<umbrel-ip>:4567
    - BSV  → stratum+tcp://<umbrel-ip>:4568
    - DGB  → stratum+tcp://<umbrel-ip>:4569
    - FB   → stratum+tcp://<umbrel-ip>:4570


  Worker format: address.workername (e.g. 1abc...xyz.rig1)
  Password: x (anything works)


  All block rewards go directly to the configured payout addresses — there is no pool fee.


  Powered by ckpool-solo (GPLv3): https://github.com/golden-guy/ckpool-solo


  © 2026 ZHT. All rights reserved.

