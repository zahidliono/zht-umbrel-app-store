version: "3.7"

services:
  app_proxy:
    environment:
      APP_HOST: zht-solo-pool-web
      APP_PORT: 80
      JWT_SECRET: "${JWT_SECRET}"
    networks:
      - umbrel_main_network

  init:
    image: alpine:3.22.1
    volumes:
      - ${APP_DATA_DIR}/data:/data
    command:
      - /bin/sh
      - -ec
      - |-
        set -eu
        mkdir -p /data/bch /data/bsv /data/dgb /data/fb /data/web
        chown -R 1000:1000 /data

        if [ ! -f /data/bch/ckpool.conf ]; then
          printf '%s\n' \
            '{' \
            '  "btcd": [{"url": "umbrel-host:9002", "auth": "zahidliono", "pass": "Idd=9108", "notify": true}],' \
            '  "btcaddress": "114iaCze9nXjXDSWqRZBXQp5tLPtraWyAS",' \
            '  "btcsig": "/ZHT Solo BCH/",' \
            '  "blockpoll": 100,' \
            '  "nonce1length": 4,' \
            '  "nonce2length": 8,' \
            '  "update_interval": 30,' \
            '  "version_mask": "1fffe000",' \
            '  "serverurl": ["0.0.0.0:3333"],' \
            '  "mindiff": 1,' \
            '  "startdiff": 42,' \
            '  "maxdiff": 0,' \
            '  "logdir": "/tmp"' \
            '}' \
            > /data/bch/ckpool.conf
          chmod 644 /data/bch/ckpool.conf
          chown 1000:1000 /data/bch/ckpool.conf
        fi

        if [ ! -f /data/bsv/ckpool.conf ]; then
          printf '%s\n' \
            '{' \
            '  "btcd": [{"url": "umbrel-host:9005", "auth": "zahidliono", "pass": "Idd=9108", "notify": true}],' \
            '  "btcaddress": "15h2EzxbiKxtTxHQB5NbXK3MmiZfrPLRx5",' \
            '  "btcsig": "/ZHT Solo BSV/",' \
            '  "blockpoll": 100,' \
            '  "nonce1length": 4,' \
            '  "nonce2length": 8,' \
            '  "update_interval": 30,' \
            '  "version_mask": "1fffe000",' \
            '  "serverurl": ["0.0.0.0:3333"],' \
            '  "mindiff": 1,' \
            '  "startdiff": 42,' \
            '  "maxdiff": 0,' \
            '  "logdir": "/tmp"' \
            '}' \
            > /data/bsv/ckpool.conf
          chmod 644 /data/bsv/ckpool.conf
          chown 1000:1000 /data/bsv/ckpool.conf
        fi

        if [ ! -f /data/dgb/ckpool.conf ]; then
          printf '%s\n' \
            '{' \
            '  "btcd": [{"url": "umbrel-host:9001", "auth": "zahidliono", "pass": "Idd=9108", "notify": true}],' \
            '  "btcaddress": "DSirDMVw89VweK3jPsRGwTYPrFYPztnJio",' \
            '  "btcsig": "/ZHT Solo DGB/",' \
            '  "blockpoll": 100,' \
            '  "nonce1length": 4,' \
            '  "nonce2length": 8,' \
            '  "update_interval": 30,' \
            '  "version_mask": "1fffe000",' \
            '  "serverurl": ["0.0.0.0:3333"],' \
            '  "mindiff": 1,' \
            '  "startdiff": 42,' \
            '  "maxdiff": 0,' \
            '  "logdir": "/tmp"' \
            '}' \
            > /data/dgb/ckpool.conf
          chmod 644 /data/dgb/ckpool.conf
          chown 1000:1000 /data/dgb/ckpool.conf
        fi

        if [ ! -f /data/fb/ckpool.conf ]; then
          printf '%s\n' \
            '{' \
            '  "btcd": [{"url": "umbrel-host:9007", "auth": "zahidliono", "pass": "Idd=9108", "notify": true}],' \
            '  "btcaddress": "bc1qfhf0axdqemskfs6pdlrun9q0ulg0rmhrercjzj",' \
            '  "btcsig": "/ZHT Solo FB/",' \
            '  "blockpoll": 100,' \
            '  "nonce1length": 4,' \
            '  "nonce2length": 8,' \
            '  "update_interval": 30,' \
            '  "version_mask": "1fffe000",' \
            '  "serverurl": ["0.0.0.0:3333"],' \
            '  "mindiff": 1,' \
            '  "startdiff": 42,' \
            '  "maxdiff": 0,' \
            '  "logdir": "/tmp"' \
            '}' \
            > /data/fb/ckpool.conf
          chmod 644 /data/fb/ckpool.conf
          chown 1000:1000 /data/fb/ckpool.conf
        fi

        printf '%s\n' \
          '<!DOCTYPE html>' \
          '<html lang="en"><head><meta charset="utf-8">' \
          '<title>ZHT Solo Mining Pool</title>' \
          '<style>' \
          'body{font-family:monospace;background:#0d1117;color:#e6edf3;padding:2rem;max-width:720px;margin:0 auto}' \
          'h1{color:#0AC18E;margin-bottom:.25rem}' \
          'p{color:#8b949e;margin-top:0}' \
          'table{border-collapse:collapse;width:100%;margin-top:1.5rem}' \
          'th{background:#161b22;color:#8b949e;padding:.6rem 1rem;text-align:left;font-weight:normal}' \
          'td{border-top:1px solid #21262d;padding:.6rem 1rem}' \
          '.coin{font-weight:bold;color:#e6edf3}' \
          '.url{color:#58a6ff}' \
          '.dim{color:#8b949e}' \
          '</style></head>' \
          '<body>' \
          '<h1>ZHT Solo Mining Pool</h1>' \
          '<p>Point your ASIC at <b>umbrel.local</b> (or your Umbrel IP) on the stratum port for each coin.</p>' \
          '<table>' \
          '<tr><th>Coin</th><th>Stratum URL</th><th>Worker</th><th>Password</th></tr>' \
          '<tr><td class="coin">BCH</td><td class="url">stratum+tcp://umbrel.local:4567</td><td class="dim">address.worker1</td><td class="dim">x</td></tr>' \
          '<tr><td class="coin">BSV</td><td class="url">stratum+tcp://umbrel.local:4568</td><td class="dim">address.worker1</td><td class="dim">x</td></tr>' \
          '<tr><td class="coin">DGB</td><td class="url">stratum+tcp://umbrel.local:4569</td><td class="dim">address.worker1</td><td class="dim">x</td></tr>' \
          '<tr><td class="coin">FB</td><td class="url">stratum+tcp://umbrel.local:4570</td><td class="dim">address.worker1</td><td class="dim">x</td></tr>' \
          '</table>' \
          '</body></html>' \
          > /data/web/index.html
        chmod 644 /data/web/index.html
        chown 1000:1000 /data/web/index.html

  ckpool-bch:
    image: ghcr.io/zahidliono/zht-ckpool:latest
    user: "1000:1000"
    restart: on-failure
    stop_grace_period: 30s
    depends_on:
      init:
        condition: service_completed_successfully
    extra_hosts:
      - "umbrel-host:host-gateway"
    ports:
      - "4567:3333/tcp"
    volumes:
      - ${APP_DATA_DIR}/data/bch/ckpool.conf:/ckpool.conf:ro
    command: ["-B", "-c", "/ckpool.conf"]

  ckpool-bsv:
    image: ghcr.io/zahidliono/zht-ckpool:latest
    user: "1000:1000"
    restart: on-failure
    stop_grace_period: 30s
    depends_on:
      init:
        condition: service_completed_successfully
    extra_hosts:
      - "umbrel-host:host-gateway"
    ports:
      - "4568:3333/tcp"
    volumes:
      - ${APP_DATA_DIR}/data/bsv/ckpool.conf:/ckpool.conf:ro
    command: ["-B", "-c", "/ckpool.conf"]

  ckpool-dgb:
    image: ghcr.io/zahidliono/zht-ckpool:latest
    user: "1000:1000"
    restart: on-failure
    stop_grace_period: 30s
    depends_on:
      init:
        condition: service_completed_successfully
    extra_hosts:
      - "umbrel-host:host-gateway"
    ports:
      - "4569:3333/tcp"
    volumes:
      - ${APP_DATA_DIR}/data/dgb/ckpool.conf:/ckpool.conf:ro
    command: ["-B", "-c", "/ckpool.conf"]

  ckpool-fb:
    image: ghcr.io/zahidliono/zht-ckpool:latest
    user: "1000:1000"
    restart: on-failure
    stop_grace_period: 30s
    depends_on:
      init:
        condition: service_completed_successfully
    extra_hosts:
      - "umbrel-host:host-gateway"
    ports:
      - "4570:3333/tcp"
    volumes:
      - ${APP_DATA_DIR}/data/fb/ckpool.conf:/ckpool.conf:ro
    command: ["-B", "-c", "/ckpool.conf"]

  web:
    image: nginx:alpine
    restart: on-failure
    stop_grace_period: 10s
    depends_on:
      init:
        condition: service_completed_successfully
    networks:
      default: {}
      umbrel_main_network:
        aliases:
          - zht-solo-pool-web
    volumes:
      - ${APP_DATA_DIR}/data/web:/usr/share/nginx/html:ro

networks:
  umbrel_main_network:
    external: true
    name: umbrel_main_network
